[general]
gpio_server_sock='/tmp/pi-chamb.sock'
chamber_temperature_sensors=['chamber']
status_timeinterval=1000

[web_server]
port=3000
ui_dir='/home/pi/pi-chamber/pi-chamber-ui/dist'

[[temperature_sensors]]
name='chamber'
type='MAX31865'

[temperature_sensors.options]
bus=0
device=0
wires=3
rtdNominal=100
refResistor=430

[[gpio_devices]]
name='inner led'
gpio=27
initial_value=0

[[gpio_devices]]
name='outer led'
gpio=22
initial_value=1

[[gpio_devices]]
name='main fan'
gpio=17

[[pwm_devices]]
name='main heater'
gpio=12
frequency=0.5 # = ~2 sec (max: 100) (formula: period = 1000ms / frequency)
initial_value=10