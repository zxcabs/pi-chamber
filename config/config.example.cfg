[general]
gpio_server_sock='/tmp/pi-chamb.sock'
chamber_temperature_sensors=['chamber']
status_timeinterval=1000
pigpio_server_host='localhost'
pigpio_server_port=8888

[web_server]
port=3000
ui_dir='/home/pi/pi-chamber/pi-chamber-ui/dist'

[[temperature_sensors]]
name='chamber'
type='MAX31865'

[temperature_sensors.options]
bus=0
device=0
wires=3
rtdNominal=100
refResistor=430

[[gpio_devices]]
name='inner led'
gpio=27
initial_value=0

[[gpio_devices]]
name='outer led'
gpio=22
initial_value=1

[[gpio_devices]]
name='main fan'
gpio=17