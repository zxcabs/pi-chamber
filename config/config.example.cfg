[general]
gpio_server_sock='/tmp/pi-chamb.sock'
status_timeinterval=1000

[web_server]
port=3000
ui_dir='/home/pi/pi-chamber/pi-chamber-ui/dist'

[[temperature_sensors]]
name='temp sensor 1'
type='MAX31865'

[temperature_sensors.options]
bus=0
device=0
wires=3
rtdNominal=100
refResistor=430

[[gpio_devices]]
name='led 1'
gpio=27
initial_value=0

[[gpio_devices]]
name='led 2'
gpio=22
initial_value=1

[[gpio_devices]]
name='main fan'
gpio=17

[[pwm_devices]]
name='main heater'
gpio=12
frequency=0.5 # = ~2 sec (max: 100) (formula: period = 1000ms / frequency)
initial_value=0

[[heating_chambers]]
name='Default heating chamber'
temperature_sensors=['temp sensor 1']
lights=['led 1', 'led 2']
heaters=['main heater']
fans=['main fan']
activate_fans_temperature=30
lights_timeout=1000